# → /etc/nginx/sites-available/narendragupta.in.conf   (symlink into sites-enabled)
# Static Astro build, published to /srv/portfolio/current by deploy/vps/publish.sh.
# HTTP-only as committed; `certbot --nginx -d narendragupta.in -d www.narendragupta.in --redirect`
# adds the 443 block + the HTTP→HTTPS redirect in place.
server {
    listen 80;
    listen [::]:80;
    server_name narendragupta.in www.narendragupta.in;

    root /srv/portfolio/current;
    index index.html;
    charset utf-8;
    charset_types text/plain text/markdown application/json text/css application/javascript image/svg+xml;

    gzip on;
    gzip_types text/plain text/markdown text/css application/javascript application/json image/svg+xml application/xml;

    location ~ /\.(?!well-known) { deny all; }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    location ~ \.md$ { default_type text/markdown; }
    # Hashed asset filenames: cache for a year.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
}
